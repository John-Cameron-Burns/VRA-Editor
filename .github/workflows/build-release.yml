name: Build distributions

# Builds the macOS .app, the Windows installer, and the Linux .deb the
# same way build_macos_app.command / build_windows_installer.bat /
# packaging/build_linux_deb.sh do locally -- this workflow calls those
# scripts directly rather than re-implementing their steps, so CI and a
# local build can never quietly drift apart.
#
# Push a "v*.*.*" tag to build all three and publish them to a GitHub
# Release. Use "Run workflow" (workflow_dispatch) to just build and
# sanity-check them without publishing anything -- the three build jobs
# still run and their output is downloadable from that run's Summary
# page, but the release job only runs for an actual tag push.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

env:
  # Pinned rather than "latest 3.x" -- keeps macOS/Windows/Linux builds
  # on the exact same interpreter, and avoids a newly-released Python
  # briefly lacking wheels for a less-mainstream dependency like
  # pyexiv2 on one of the three platforms.
  PYTHON_VERSION: '3.12'

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine version
        # Only set for a tag push (v1.2.3 -> 1.2.3) -- unset on a
        # workflow_dispatch dry run, so the build falls back to
        # VRA_Editor.spec's own hardcoded default.
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VRA_EDITOR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install pyexiv2's runtime dependencies
        # The pyexiv2 wheel's bundled libexiv2.dylib is built against
        # Homebrew's exiv2 and links dynamically against these three at
        # import time (confirmed via `otool -L` against the same wheel
        # locally, where they're already installed) -- a fresh
        # macos-latest runner doesn't have them, so `import pyexiv2`
        # inside VRA_Editor.spec fails with a dlopen "Library not
        # loaded" error before PyInstaller ever starts bundling.
        run: brew install brotli gettext inih

      - name: Build .app
        run: ./build_macos_app.command
        env:
          CI: true

      - name: Zip the .app bundle
        # GitHub Release assets (and upload-artifact) need a single
        # file, not a directory bundle.
        run: |
          VERSION="${VRA_EDITOR_VERSION:-1.0.0}"
          cd distributions && zip -r "VRA_Editor_${VERSION}_macOS.app.zip" "VRA Editor.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: distributions/VRA_Editor_*_macOS.app.zip

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Add-Content $env:GITHUB_ENV "VRA_EDITOR_VERSION=$version"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Add Inno Setup to PATH
        # build_windows_installer.bat also checks the Inno Setup 7
        # paths and falls back to `where ISCC.exe`, but Chocolatey's
        # innosetup package doesn't always add itself to PATH -- adding
        # both the 6 and 7 install dirs here covers whichever version
        # it resolves to without needing to hardcode one.
        shell: pwsh
        run: |
          foreach ($dir in @(
            "C:\Program Files (x86)\Inno Setup 6",
            "C:\Program Files\Inno Setup 6",
            "C:\Program Files (x86)\Inno Setup 7",
            "C:\Program Files\Inno Setup 7"
          )) {
            if (Test-Path $dir) { Add-Content $env:GITHUB_PATH $dir }
          }

      - name: Build installer
        shell: cmd
        run: build_windows_installer.bat

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: distributions/*.exe

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VRA_EDITOR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        # fakeroot/dpkg-dev package the .deb; the rest are PySide6/Qt6's
        # own runtime libs, needed at import time during the PyInstaller
        # freeze -- see packaging/build_linux_deb.sh's own header
        # comment, which documents this exact list.
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-glx0

      - name: Build .deb
        run: bash packaging/build_linux_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: distributions/*.deb

  release:
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-app/*.zip
            artifacts/windows-installer/*.exe
            artifacts/linux-deb/*.deb
